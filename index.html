<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Peças - adriapetroski-lab</title>
    <style>
        :root {
            --primary: #0056b3;
            --dark: #212529;
            --light: #f8f9fa;
            --border: #dee2e6;
            --success: #28a745;
            --danger: #dc3545;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--light);
            color: var(--dark);
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; color: var(--primary); margin-bottom: 25px; }
        .section-divider {
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
            color: #6c757d;
            position: relative;
        }
        .section-divider::before, .section-divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 43%;
            height: 1px;
            background: var(--border);
        }
        .section-divider::before { left: 0; }
        .section-divider::after { right: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input#placa { 
            text-transform: uppercase; 
            text-align: center; 
            font-size: 20px; 
            font-weight: bold; 
            letter-spacing: 2px;
        }
        button.btn-search {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        button.btn-search:hover { background-color: #004085; }
        .result-box {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background-color: #fafafa;
            display: none;
        }
        .vehicle-info {
            background-color: #e2e3e5;
            padding: 15px;
            border-radius: 4px;
            font-size: 18px;
            border-left: 6px solid var(--success);
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .category-title {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 5px;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th { background-color: #f1f1f1; }
    </style>
</head>
<body>

<div class="container">
    <h1>Catálogo de Peças - adriapetroski-lab</h1>
    
    <!-- Opção 1: Placa -->
    <div class="form-group">
        <label for="placa">Opção 1: Buscar por Placa</label>
        <input type="text" id="placa" placeholder="Digite a placa (Ex: ABC1D23)" maxlength="7">
    </div>

    <div class="section-divider">OU</div>

    <!-- Opção 2: Modelo e Ano -->
    <div class="form-group">
        <label for="modelo-input">Opção 2: Buscar por Modelo</label>
        <input type="text" id="modelo-input" placeholder="Digite o modelo (Ex: Gol, Corsa)">
    </div>
    <div class="form-group">
        <label for="ano-input">Ano do Veículo</label>
        <input type="number" id="ano-input" placeholder="Digite o ano (Ex: 2022)" min="1980" max="2027">
    </div>

    <!-- Seleção de Categoria -->
    <div class="form-group" style="margin-top: 25px;">
        <label for="categoria">Selecione a Categoria de Peças Requerida:</label>
        <select id="categoria">
            <option value="">-- Escolha uma Categoria --</option>
            <option value="oleo_filtros">Óleo e Filtros</option>
            <option value="amortecedores">Amortecedores e Kits Completos</option>
            <option value="freios">Freios (Marcas Mais Usadas)</option>
            <option value="suspensao">Outras Peças de Suspensão</option>
        </select>
    </div>

    <button class="btn-search" onclick="executarBusca()">Buscar Informações</button>

    <div id="resultado" class="result-box"></div>
</div>

<script>
const bancoDadosVeiculos = [
    {
        id: "v1", placa: "ABC1D23", marca: "Volkswagen", modelo: "Gol", versao: "1.0 MPI", ano: 2022,
        oleo_filtros: {
            viscosidade: "5W30 Sintético", quantidade: "3.5 Litros",
            filtros: [
                { nome: "Filtro de Óleo", marca: "Tecfil", codigo: "TM1" },
                { nome: "Filtro de Combustível", marca: "Tecfil", codigo: "GI04/7" },
                { nome: "Filtro de Ar do Motor", marca: "Tecfil", codigo: "ARL6096" },
                { nome: "Filtro de Ar Condicionado (Cabine)", marca: "Tecfil", codigo: "ACP303" }
            ]
        },
        amortecedores: {
            pecas: [
                { item: "Amortecedor Dianteiro (Par)", marca: "Cofap", codigo: "GP32287" },
                { item: "Amortecedor Traseiro (Par)", marca: "Cofap", codigo: "GB32312" },
                { item: "Kit Dianteiro (Com Coxim)", marca: "Axios", codigo: "BR10100" },
                { item: "Kit Dianteiro (Sem Coxim)", marca: "Axios", codigo: "BR10101" },
                { item: "Kit Traseiro (Com Coxim)", marca: "Axios", codigo: "BR20201" },
                { item: "Kit Traseiro (Sem Coxim)", marca: "Axios", codigo: "BR20200" }
            ]
        },
        freios: { pecas: [{ item: "Pastilha Dianteira", marca: "Fras-le", codigo: "PD/60" }, { item: "Disco Dianteiro", marca: "Fremax", codigo: "BD-5600" }] },
        suspensao: { pecas: [{ item: "Bucha da Bandeja", marca: "Axios", codigo: "011.123" }, { item: "Pivô", marca: "Nakata", codigo: "N1002" }] }
    },
    {
        id: "v2", placa: "XYZ9999", marca: "Chevrolet", modelo: "Corsa", versao: "Wind 1.4", ano: 1999,
        oleo_filtros: {
            viscosidade: "15W40 Semiaquático", quantidade: "3.5 Litros",
            filtros: [
                { nome: "Filtro de Óleo", marca: "Tecfil", codigo: "TM2" },
                { nome: "Filtro de Combustível", marca: "Tecfil", codigo: "GI01/1" },
                { nome: "Filtro de Ar do Motor", marca: "Tecfil", codigo: "ARL1640" },
                { nome: "Filtro de Ar Condicionado (Cabine)", marca: "Tecfil", codigo: "ACP811" }
            ]
        },
        amortecedores: {
            pecas: [
                { item: "Amortecedor Dianteiro (Par)", marca: "Cofap", codigo: "MP30055" },
                { item: "Amortecedor Traseiro (Par)", marca: "Cofap", codigo: "MP30056" },
                { item: "Kit Dianteiro (Com Coxim)", marca: "Axios", codigo: "BR10900" },
                { item: "Kit Dianteiro (Sem Coxim)", marca: "Axios", codigo: "BR10901" },
                { item: "Kit Traseiro (Com Coxim)", marca: "Axios", codigo: "BR20901" },
                { item: "Kit Traseiro (Sem Coxim)", marca: "Axios", codigo: "BR20900" }
            ]
        },
        freios: { pecas: [{ item: "Pastilha de Freio Dianteira", marca: "Fras-le", codigo: "PD/63-A" }] },
        suspensao: { pecas: [{ item: "Terminal de Direção", marca: "Nakata", codigo: "N112" }] }
    }
];

function executarBusca() {
    const placaInput = document.getElementById("placa").value.trim().toUpperCase();
    const modeloInput = document.getElementById("modelo-input").value.trim().toLowerCase();
    const anoInput = parseInt(document.getElementById("ano-input").value);
    const categoria = document.getElementById("categoria").value;
    const resultadoDiv = document.getElementById("resultado");

    if (!categoria) {
        alert("Por favor, selecione uma categoria de peças.");
        return;
    }

    const temPlaca = placaInput.length > 0;
    const temModeloEAno = modeloInput.length > 0 && !isNaN(anoInput);

    if (!temPlaca && !temModeloEAno) {
        alert("Erro: Preencha a Placa OU informe o Modelo junto com o Ano do veículo.");
        return;
    }

    let veiculoLocalizado = null;

    if (temPlaca) {
        veiculoLocalizado = bancoDadosVeiculos.find(v => v.placa === placaInput);
    } else {
        veiculoLocalizado = bancoDadosVeiculos.find(v => 
            v.modelo.toLowerCase().includes(modeloInput) && v.ano === anoInput
        );
    }

    resultadoDiv.style.display = "block";

    if (veiculoLocalizado) {
        renderizarPainelResultados(veiculoLocalizado, categoria);
    } else {
        resultadoDiv.innerHTML = `
            <div class='vehicle-info' style='background-color:#f8d7da; color:#721c24; border-left-color:#dc3545;'>
                ⚠️ Nenhum veículo localizado com os critérios informados. <br>
                <strong>Para testar use:</strong> Placa: <code>ABC1D23</code> ou digite Modelo: <code>Gol</code> e Ano: <code>2022</code>.
            </div>`;
    }
}

function renderizarPainelResultados(veiculo, categoria) {
    const resultadoDiv = document.getElementById("resultado");
    
    let htmlContent = `
        <div class="vehicle-info">
