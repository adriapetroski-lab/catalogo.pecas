<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Online de Peças - adriapetroski-lab</title>
    <style>
        :root {
            --primary: #0056b3;
            --dark: #212529;
            --light: #f8f9fa;
            --border: #dee2e6;
            --success: #28a745;
            --danger: #dc3545;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--light);
            color: var(--dark);
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; color: var(--primary); margin-bottom: 25px; }
        .section-divider {
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
            color: #6c757d;
            position: relative;
        }
        .section-divider::before, .section-divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 43%;
            height: 1px;
            background: var(--border);
        }
        .section-divider::before { left: 0; }
        .section-divider::after { right: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input#placa { 
            text-transform: uppercase; 
            text-align: center; 
            font-size: 20px; 
            font-weight: bold; 
            letter-spacing: 2px;
        }
        button.btn-search {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        button.btn-search:hover { background-color: #004085; }
        .result-box {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background-color: #fafafa;
            display: none;
        }
        .vehicle-info {
            background-color: #e2e3e5;
            padding: 15px;
            border-radius: 4px;
            font-size: 18px;
            border-left: 6px solid var(--success);
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .category-title {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 5px;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th { background-color: #f1f1f1; }
        .loading-text {
            color: var(--primary);
            font-weight: bold;
            text-align: center;
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Catálogo de Peças Online - adriapetroski-lab</h1>
    
    <!-- Opção 1: Placa -->
    <div class="form-group">
        <label for="placa">Opção 1: Buscar por Placa (Rede Online)</label>
        <input type="text" id="placa" placeholder="Digite a placa (Ex: ABC1D23)" maxlength="7">
    </div>

    <div class="section-divider">OU</div>

    <!-- Opção 2: Modelo -->
    <div class="form-group">
        <label for="modelo-input">Opção 2: Buscar por Modelo na Tabela FIPE</label>
        <input type="text" id="modelo-input" placeholder="Digite o modelo (Ex: Gol, Corsa, Onix)">
    </div>

    <!-- Categoria Requerida -->
    <div class="form-group" style="margin-top: 25px;">
        <label for="categoria">Selecione a Categoria de Peças Requerida:</label>
        <select id="categoria">
            <option value="">-- Escolha uma Categoria --</option>
            <option value="oleo_filtros">Óleo e Filtros</option>
            <option value="amortecedores">Amortecedores e Kits Completos</option>
            <option value="freios">Freios (Marcas Mais Usadas)</option>
            <option value="suspensao">Outras Peças de Suspensão</option>
        </select>
    </div>

    <button class="btn-search" onclick="executarBuscaNoSitema()">Buscar Informações na Rede</button>
    <div id="loading" class="loading-text">Buscando dados em tempo real nas APIs...</div>

    <div id="resultado" class="result-box"></div>
</div>
