<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Multicritério de Peças - adriapetroski-lab</title>
    <style>
        :root {
            --primary: #0056b3;
            --dark: #212529;
            --light: #f8f9fa;
            --border: #dee2e6;
            --success: #28a745;
            --danger: #dc3545;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--light);
            color: var(--dark);
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; color: var(--primary); margin-bottom: 30px; }
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #6c757d;
            border-bottom: 3px solid transparent;
        }
        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .form-group { margin-bottom: 20px; }
        .search-panel { display: none; }
        .search-panel.active { display: block; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input#placa { 
            text-transform: uppercase; 
            text-align: center; 
            font-size: 22px; 
            font-weight: bold; 
            letter-spacing: 3px;
        }
        button.btn-search {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.btn-search:hover { background-color: #004085; }
        .result-box {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background-color: #fafafa;
            display: none;
        }
        .vehicle-info {
            background-color: #e2e3e5;
            padding: 15px;
            border-radius: 4px;
            font-size: 18px;
            border-left: 6px solid var(--success);
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .category-title {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 5px;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th { background-color: #f1f1f1; }
        .loading { text-align: center; font-weight: bold; color: var(--primary); display: none; margin: 15px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>Catálogo de Peças - adriapetroski-lab</h1>
    
    <!-- Duas formas de busca separadas por abas -->
    <div class="tabs">
        <button id="btn-placa" class="tab-btn active" onclick="switchTab('aba-placa')">Busca por Placa</button>
        <button id="btn-modelo" class="tab-btn" onclick="switchTab('aba-modelo')">Busca por Modelo e Ano</button>
    </div>

    <!-- Forma 1: Painel por Placa -->
    <div id="aba-placa" class="search-panel active">
        <div class="form-group">
            <label for="placa">Digite a Placa do Veículo:</label>
            <input type="text" id="placa" placeholder="EX: ABC1D23" maxlength="7">
        </div>
    </div>

    <!-- Forma 2: Painel por Modelo e Ano -->
    <div id="aba-modelo" class="search-panel">
        <div class="form-group">
            <label for="modelo-input">Digite o Modelo do Veículo:</label>
            <input type="text" id="modelo-input" placeholder="Ex: Gol, Corsa, Fiesta...">
        </div>
        <div class="form-group">
            <label for="ano-input">Digite o Ano do Veículo:</label>
            <input type="number" id="ano-input" placeholder="Ex: 2022" min="1980" max="2027">
        </div>
    </div>

    <!-- Filtro de categoria de peças -->
    <div class="form-group">
        <label for="categoria">Selecione a Categoria de Peças:</label>
        <select id="categoria">
            <option value="">-- Escolha uma Categoria --</option>
            <option value="oleo_filtros">Óleo e Filtros</option>
            <option value="amortecedores">Amortecedores e Kits Completos</option>
            <option value="freios">Freios</option>
            <option value="suspensao">Outras Peças de Suspensão</option>
        </select>
    </div>

    <button class="btn-search" onclick="executarBusca()">Buscar Informações</button>
    <div id="loading" class="loading">Consultando banco de dados técnico...</div>

    <div id="resultado" class="result-box"></div>
</div>

function switchTab(tabId) {
    modoAtual = tabId;
    document.getElementById('btn-placa').classList.remove('active');
    document.getElementById('btn-modelo').classList.remove('active');
    document.getElementById('aba-placa').classList.remove('active');

        document.getElementById('btn-placa').classList.add('active');
    } else {
        document.getElementById('btn-modelo').classList.add('active');
    }
    document.getElementById(tabId).classList.add('active');
    document.getElementById("resultado").style.display = "none";
}
